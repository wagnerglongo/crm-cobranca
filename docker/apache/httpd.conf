ServerName localhost
Listen 80
Listen 5601

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so

User daemon
Group daemon

DocumentRoot "/var/www/html/public"
DirectoryIndex index.php index.html

TypesConfig conf/mime.types
AddType application/x-httpd-php .php

<Directory "/var/www/html/public">
    Options FollowSymLinks
    AllowOverride All
    Require all granted

    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^api/v1(?:/.*)?$ /api/v1/index.php [QSA,L]
    RewriteRule ^api/openapi\.json$ /api/openapi.php [QSA,L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [QSA,L]
</Directory>

SetEnvIfNoCase Authorization "(.+)" HTTP_AUTHORIZATION=$1

<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>

ProxyTimeout 300
Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

ErrorLog /proc/self/fd/2
# Achado 2026-10-05: "common" era usado sem LogFormat definido, e cada
# requisicao gravava so a palavra "common". %D = duracao em microssegundos.
# Host e X-Forwarded-* (2026-10-06): o HTTPS e feito pelo proxy da empresa
# (crm.exemplo.com.br) - mostra quem chega por ele e com qual protocolo.
LogFormat "%h %l %u %t \"%r\" %>s %b %D \"%{Host}i\" \"%{X-Forwarded-For}i\" \"%{X-Forwarded-Proto}i\"" crm
CustomLog /proc/self/fd/1 crm

# Porteiro do Dashboards: so o proprio Apache (127.0.0.1) pode chamar.
<Files "dashboards_auth.php">
    Require ip 127.0.0.1
</Files>

# OpenSearch Dashboards: nao e' publicado direto; so' entra por aqui, com o login
# e senha do Pactua e a permissao 'dashboards.acessar' (ver public/dashboards_auth.php).
# Basic auth em HTTP puro - rede local.
<VirtualHost *:5601>
    RewriteEngine On
    RewriteMap wauth "prg:/usr/local/apache2/conf/works-auth.sh"

    RewriteCond %{HTTP:Authorization} ^Basic\s+(\S+)$ [NC]
    RewriteCond ${wauth:%1|DENY} =OK
    RewriteRule ^ - [S=1]
    RewriteRule ^ - [R=401,L,E=precisa_login:1]
    Header always set WWW-Authenticate "Basic realm=\"Pactua - OpenSearch Dashboards\"" env=precisa_login

    ProxyPreserveHost On
    ProxyTimeout 120
    RewriteRule ^/?(.*)$ http://opensearch-dashboards:5601/$1 [P,QSA,L]
    ProxyPassReverse / http://opensearch-dashboards:5601/
</VirtualHost>
