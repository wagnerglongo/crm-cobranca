; So no container de HOMOLOGACAO (php-homolog), 2026-10-06.
; Cookie de sessao com outro nome: os cookies nao separam por porta, entao com
; o mesmo nome entrar na homologacao (8081) derrubaria o login da producao (8080).
session.name = CRMHOMOLOGSESSID
; Homologacao mostra o erro na tela (e ambiente de teste interno).
display_errors = On
