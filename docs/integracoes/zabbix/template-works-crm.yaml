    - uuid: 61d84ccda705446dad47ba833668723e
      name: 'Operação: acordos criados hoje'
      type: DEPENDENT
      key: crm.acordos.hoje
      delay: '0'
      value_type: UNSIGNED
      description: Métrica crm_acordos_criados_hoje do /metrics.php.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - crm_acordos_criados_hoje
        - value
        - ''
      master_item:
        key: crm.metricas.get
      tags:
      - tag: component
        value: operacao
    - uuid: 73f39c5ba2a44930aab1c5887b455a56
      name: 'OpenSearch: diferença de contratos para o MySQL'
      type: CALCULATED
      key: crm.opensearch.diferenca
      delay: 1m
      value_type: FLOAT
      params: abs(last(//crm.mysql.contratos)-last(//crm.opensearch.contratos))
      description: Contratos no MySQL menos contratos no índice do OpenSearch (0 = sincronizado).
      tags:
      - tag: component
        value: opensearch
      triggers:
      - uuid: 351a1903dc064c729154d79acbdc10ec
        expression: min(/Pactua CRM by HTTP/crm.opensearch.diferenca,2h)>{$CRM.OPENSEARCH.DIFERENCA.MAX}
        name: OpenSearch desincronizado do MySQL há 2h (mais de {$CRM.OPENSEARCH.DIFERENCA.MAX} contratos)
        priority: AVERAGE
        description: O CDC não está levando as mudanças do MySQL para o OpenSearch.
        tags:
        - tag: scope
          value: availability
    discovery_rules:
    - uuid: 628819b19f724f30b7620639ebf827a1
      name: Containers do CRM
      type: DEPENDENT
      key: crm.containers.descoberta
      delay: '0'
      lifetime: 7d
      description: ''
      item_prototypes:
      - uuid: bb9196cfc2f74419a3a4fc18d70f84c8
        name: 'Container {#CONTAINER}: rodando'
        type: DEPENDENT
        key: crm.container.rodando[{#CONTAINER}]
        delay: '0'
        value_type: UNSIGNED
        description: Métrica crm_container_rodando{container="{#CONTAINER}"} do /metrics.php.
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - crm_container_rodando{container="{#CONTAINER}"}
          - value
          - ''
        master_item:
          key: crm.metricas.get
        tags:
        - tag: component
          value: containers
        valuemap:
          name: CRM rodando
        trigger_prototypes:
        - uuid: 3e46a42e6fb5490fa9bba63e628b52c4
          expression: max(/Pactua CRM by HTTP/crm.container.rodando[{#CONTAINER}],5m)=0
          name: Container {#CONTAINER} parado há 5 min
          priority: HIGH
          description: Container do CRM parado na VM 10.0.0.74.
          tags:
          - tag: scope
            value: availability
      - uuid: e99f7db1390049dbbdae2382b5759947
        name: 'Container {#CONTAINER}: reinícios'
        type: DEPENDENT
        key: crm.container.reinicios[{#CONTAINER}]
        delay: '0'
        value_type: UNSIGNED
        description: Métrica crm_container_reinicios{container="{#CONTAINER}"} do /metrics.php.
        preprocessing:
        - type: PROMETHEUS_PATTERN
          parameters:
          - crm_container_reinicios{container="{#CONTAINER}"}
          - value
          - ''
        master_item:
          key: crm.metricas.get
        tags:
        - tag: component
          value: containers
      master_item:
        key: crm.metricas.get
      preprocessing:
      - type: PROMETHEUS_TO_JSON
        parameters:
        - crm_container_rodando
      lld_macro_paths:
      - lld_macro: '{#CONTAINER}'
        path: $.labels.container
    - uuid: 542c5bcd798e40fcafb13475301b6788
      name: Containers do CRM com healthcheck
      type: DEPENDENT
      key: crm.containers.saude.descoberta
      delay: '0'
      lifetime: 7d
      description: ''
      item_prototypes:
      - uuid: 47183aa5b85d4c0db544e0f9256bac23
        name: 'Container {#CONTAINER}: saudável'
        type: DEPENDENT
        key: crm.container.saudavel[{#CONTAINER}]
        delay: '0'
        value_type: UNSIGNED
        description: Métrica crm_container_saudavel{container="{#CONTAINER}"} do /metrics.php.
        preprocessing:
