        name: MySQL com mais de {$CRM.MYSQL.SWAP.MAX} em swap há 30 min
        priority: WARNING
        description: 'MySQL lento. Paliativo: reiniciar o MySQL fora do expediente e depois a task do Debezium.'
        tags:
