    - uuid: 8c0ce8b09e8e4a18b5f5f91169cc8f6d
      name: 'Backup: idade do último backup do MySQL'
      type: DEPENDENT
      key: crm.backup.idade
      delay: '0'
      value_type: FLOAT
      description: Métrica crm_backup_ultimo_timestamp_segundos do /metrics.php.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - crm_backup_ultimo_timestamp_segundos
        - value
        - ''
      - *id001
      master_item:
        key: crm.metricas.get
      tags:
      - tag: component
        value: backup
      units: s
      triggers:
      - uuid: a8c7ef1281794a2c9723252df5cb134e
        expression: min(/Pactua CRM by HTTP/crm.backup.idade,10m)>{$CRM.BACKUP.ATRASO.MAX}
        name: Backup do MySQL atrasado (mais de {$CRM.BACKUP.ATRASO.MAX})
        priority: HIGH
        description: O backup diário das 03:30 não rodou. Ver /var/log/backup-mysql.log na VM.
        tags:
        - tag: scope
          value: availability
    - uuid: f486fd1b9d424b668a6feabdf51663ea
      name: 'Backup: tamanho do último'
      type: DEPENDENT
      key: crm.backup.tamanho
      delay: '0'
      value_type: FLOAT
      description: Métrica crm_backup_ultimo_tamanho_bytes do /metrics.php.
      preprocessing:
      - type: PROMETHEUS_PATTERN
