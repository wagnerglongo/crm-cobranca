    - uuid: 4880a7f930a24479ac88311bf30a9cd0
      name: 'Carga ACME: idade da última carga aplicada'
      type: DEPENDENT
      key: crm.carga.idade
      delay: '0'
      value_type: FLOAT
      description: Métrica crm_carga_ultima_aplicada_timestamp_segundos do /metrics.php.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - crm_carga_ultima_aplicada_timestamp_segundos
        - value
        - ''
      - *id001
      master_item:
        key: crm.metricas.get
      tags:
      - tag: component
        value: carga
      units: s
      triggers:
      - uuid: 5df2c23af64d4e80a971ec0272322293
        expression: min(/Pactua CRM by HTTP/crm.carga.idade,15m)>{$CRM.CARGA.ATRASO.MAX} and dayofweek()<>7 and time()>=090000
        name: Carga diária da ACME não aplicada (seg-sáb, depois das 9h)
        priority: HIGH
        description: A carga diária da ACME (06h) não foi aplicada. Usa o fuso do servidor Zabbix (deve ser horário de Brasília).
        tags:
        - tag: scope
          value: availability
    - uuid: 74d38d463cb34d17b47e557b903698b4
      name: 'Operação: acionamentos hoje'
      type: DEPENDENT
      key: crm.acionamentos.hoje
      delay: '0'
      value_type: UNSIGNED
      description: Métrica crm_acionamentos_hoje do /metrics.php.
