zabbix_export:
  version: '6.0'
  date: '2026-10-07T12:00:00Z'
  groups:
  - uuid: e8b63fa9df294d63ba889ea1ae31d0b8
    name: Templates/Applications
  templates:
  - uuid: 7f87b8ff063342ad971af85cd92b7db3
    template: Pactua CRM by HTTP
    name: Pactua CRM by HTTP
    description: 'Pactua CRM (VM 10.0.0.74): lê /metrics.php (formato Prometheus) com token, sem agente na VM. Vincular a um host (ex.: "Pactua CRM") e preencher a macro {$CRM.TOKEN} no host. Fonte: docs/integracoes/zabbix no repositório do CRM.'
    groups:
    - name: Templates/Applications
    items:
    - uuid: 48334ead82fa4c759472e1b289aaad49
      name: 'CRM: coleta do /metrics.php'
      type: HTTP_AGENT
      key: crm.metricas.get
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      timeout: 15s
      url: '{$CRM.URL}'
      headers:
      - name: Authorization
        value: Bearer {$CRM.TOKEN}
      description: 'Item mestre: baixa todas as métricas do CRM (formato Prometheus) a cada minuto. Os outros itens são separados daqui.'
      tags:
      - tag: component
        value: raw
    - uuid: fad0f74554aa415f9510f4d1acf801c5
      name: 'CRM: hora da última coleta na VM'
      type: DEPENDENT
      key: crm.coletor.execucao
      delay: '0'
      value_type: FLOAT
      description: Métrica crm_coletor_execucao_timestamp_segundos do /metrics.php.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - crm_coletor_execucao_timestamp_segundos
        - value
        - ''
      master_item:
        key: crm.metricas.get
      tags:
      - tag: component
        value: coletor
      units: unixtime
      triggers:
      - uuid: d77403a5b2f9409bbacca651785f49c5
        expression: nodata(/Pactua CRM by HTTP/crm.coletor.execucao,3m)=1
        name: CRM fora do ar (sem resposta do /metrics.php há 3 min)
        priority: DISASTER
        description: 'A VM 10.0.0.74, o Apache/PHP ou a rede não respondem, ou o token foi recusado (401). Ver o erro do item "CRM: coleta do /metrics.php".'
        tags:
        - tag: scope
          value: availability
    - uuid: 77f6133c1bee49efa0ce23213ca09fb0
      name: 'CRM: idade das métricas'
      type: DEPENDENT
      key: crm.metricas.idade
      delay: '0'
      value_type: FLOAT
      description: Métrica crm_metricas_idade_segundos do /metrics.php.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - crm_metricas_idade_segundos
        - value
        - ''
      master_item:
        key: crm.metricas.get
      tags:
      - tag: component
        value: coletor
      units: s
      triggers:
      - uuid: 9339611ae0ca44e4bb1949ac7b9d9f6f
        expression: min(/Pactua CRM by HTTP/crm.metricas.idade,5m)>{$CRM.COLETOR.IDADE.MAX}
        name: 'CRM: coletor de métricas parado na VM'
        priority: HIGH
        description: O cron do scripts/exportar-metricas.sh parou. Os outros alertas ficam cegos.
        tags:
        - tag: scope
          value: availability
    - uuid: 2e8636d4afdb4870bad6256e560289c2
      name: 'CRM: duração da coleta'
      type: DEPENDENT
      key: crm.coletor.duracao
      delay: '0'
      value_type: FLOAT
      description: Métrica crm_coletor_duracao_segundos do /metrics.php.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - crm_coletor_duracao_segundos
        - value
        - ''
      master_item:
        key: crm.metricas.get
      tags:
      - tag: component
        value: coletor
      units: s
    - uuid: 7db482e34a0c461b87bd8021b64615d8
      name: 'CDC: conector Debezium'
      type: DEPENDENT
      key: crm.debezium.conector
      delay: '0'
      value_type: UNSIGNED
      description: Métrica crm_debezium_conector_rodando do /metrics.php.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - crm_debezium_conector_rodando
        - value
        - ''
      master_item:
        key: crm.metricas.get
      tags:
      - tag: component
        value: cdc
      valuemap:
        name: CRM rodando
    - uuid: b05f8fa776b948478951a4ab16f918e5
      name: 'CDC: task do Debezium'
      type: DEPENDENT
      key: crm.debezium.task
      delay: '0'
      value_type: UNSIGNED
      description: Métrica crm_debezium_task_rodando do /metrics.php.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - crm_debezium_task_rodando
        - value
        - ''
      master_item:
        key: crm.metricas.get
      tags:
      - tag: component
        value: cdc
      valuemap:
        name: CRM rodando
    - uuid: ba07b0e807fa4633a06b17354bfbcda2
      name: 'CDC: idade do último evento lido do MySQL'
      type: DEPENDENT
      key: crm.debezium.offset.idade
      delay: '0'
      value_type: FLOAT
      description: Métrica crm_debezium_offset_timestamp_segundos do /metrics.php.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - crm_debezium_offset_timestamp_segundos
        - value
        - ''
      - &id001
        type: JAVASCRIPT
        parameters:
        - return Math.floor(Date.now() / 1000) - Number(value);
      master_item:
        key: crm.metricas.get
      tags:
      - tag: component
        value: cdc
      units: s
    - uuid: 8e7c36a7152d4ffe8780d1b3519e7b78
      name: 'CDC: mensagens ainda não projetadas'
      type: DEPENDENT
      key: crm.cdc.lag
      delay: '0'
      value_type: UNSIGNED
      description: Métrica crm_cdc_lag_mensagens do /metrics.php.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - crm_cdc_lag_mensagens
        - value
        - ''
      master_item:
        key: crm.metricas.get
      tags:
      - tag: component
        value: cdc
      triggers:
      - uuid: 5fa0d3f681e541ed956601b3fa0e08cf
        expression: min(/Pactua CRM by HTTP/crm.cdc.lag,1h)>{$CRM.CDC.LAG.MAX} and last(/Pactua CRM by HTTP/crm.cdc.lag)>=first(/Pactua CRM by HTTP/crm.cdc.lag,1h)
        name: 'CDC: fila com mais de {$CRM.CDC.LAG.MAX} mensagens e não diminui há 1h'
        priority: AVERAGE
        description: Worker do CDC travado? OpenSearch e dashboards atrasados.
        tags:
        - tag: scope
          value: availability
    - uuid: cadd3e98de76424ab5358eaace90de55
      name: 'OpenSearch: status'
      type: DEPENDENT
      key: crm.opensearch.status
      delay: '0'
      value_type: UNSIGNED
      description: Métrica crm_opensearch_status do /metrics.php.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - crm_opensearch_status
        - value
        - ''
      master_item:
        key: crm.metricas.get
      tags:
      - tag: component
        value: opensearch
      valuemap:
        name: CRM OpenSearch status
      triggers:
      - uuid: 2f66cd776dc249f4a6b012753b223b29
        expression: max(/Pactua CRM by HTTP/crm.opensearch.status,15m)<2
        name: OpenSearch amarelo/vermelho há 15 min
        priority: AVERAGE
        description: Busca e dashboards do CRM podem falhar.
        tags:
        - tag: scope
          value: availability
    - uuid: 8b6b77e1da244a11a56981957bb96e48
      name: 'OpenSearch: contratos indexados'
      type: DEPENDENT
      key: crm.opensearch.contratos
      delay: '0'
      value_type: UNSIGNED
      description: Métrica crm_opensearch_documentos{indice="crm_contratos_v1"} do /metrics.php.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - crm_opensearch_documentos{indice="crm_contratos_v1"}
        - value
        - ''
      master_item:
